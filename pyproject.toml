[project]
name = "mda-impl"
version = "0.1.0"
description = "Reproduction of the Model Discovery Agent ChemBench experiment"
readme = "README.md"
authors = [
    { name = "Yuta Ono", email = "youcana40627@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.125.0",
    "jaxtyping>=0.3.7",
    "numpy>=2.2.6",
    "python-dotenv>=1.2.1",
]

[project.scripts]
mda-impl = "mda:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mda"

[dependency-groups]
dev = [
    "beartype>=0.23.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "ty>=0.0.107",
]

[tool.ty.src]
exclude = ["src/mda/_vendor"]

[tool.ruff]
line-length = 100
src = ["src"]
extend-exclude = ["src/mda/_vendor"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "UP",      # pyupgrade: modernise syntax for your Python version
    "B",       # bugbear: likely bugs
    "SIM",     # simplifications
    "NPY",     # numpy-specific checks
]
ignore = [
    "E501",  # line length is handled by the formatter
    "F722",  # jaxtyping shape strings are not forward annotations
]

[tool.pytest.ini_options]
addopts = "--jaxtyping-packages=mda,beartype.beartype"
filterwarnings = [
    'ignore:Function mda\._vendor:beartype.roar.BeartypeDecorHintPep585DeprecationWarning',
]
