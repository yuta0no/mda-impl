[project]
name = "mda-impl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yuta Ono", email = "youcana40627@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.125.0",
    "numpy>=2.2.6",
    "python-dotenv>=1.2.1",
]

[project.scripts]
mda-impl = "mda:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mda"

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
src = ["src"]
extend-exclude = ["src/mda/_vendor"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "UP",      # pyupgrade: modernise syntax for your Python version
    "B",       # bugbear: likely bugs
    "SIM",     # simplifications
    "NPY",     # numpy-specific checks
]
ignore = ["E501"]  # line length is handled by the formatter
